name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Version Packages PR / tags
      pull-requests: write # open the Version Packages PR
      id-token: write # npm trusted publishing: pnpm publish exchanges the OIDC token itself (no NPM_TOKEN)
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12 # the newest 12.x; locally any pnpm that satisfies engines.pnpm runs as it is

      # No registry-url: setup-node would then write an .npmrc whose auth token
      # is the empty NODE_AUTH_TOKEN, and pnpm would send that instead of the
      # OIDC exchange (the registry answers such a publish with a 404).
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build (incl. publint + attw)
        run: pnpm build

      # Must stay on the action major that matches @changesets/cli: the action
      # decides what was published by reading the publish script's output, and
      # v1 only understands the CLI 2 wording. Paired with CLI 3 it sees no
      # published package and silently skips the tags and the GitHub releases.
      # The action publishes no moving major tag (no `v2`), so the exact tag is
      # pinned and Dependabot moves it.
      - name: Create Version PR or publish to npm
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          # v2 reads the token from this input only — a GITHUB_TOKEN env var is
          # not a substitute.
          github-token: ${{ secrets.GITHUB_TOKEN }}
